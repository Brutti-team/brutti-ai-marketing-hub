<!doctype html>
<html lang="en-MY">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3128" />
    <title>BRUTTI AI · Offline</title>
    <style>
      *{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;background:#f3f0e8;color:#1f2622;font-family:Arial,sans-serif}.card{width:min(100%,440px);padding:30px;border:1px solid #ddd9cf;border-radius:24px;background:#fffdf8;box-shadow:0 20px 60px rgba(31,49,40,.12)}.logo{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:#365d49;color:#fff;font:700 15px Georgia,serif}h1{margin:22px 0 10px;font:500 32px/1.1 Georgia,serif}p{margin:0;color:#526057;font-size:14px;line-height:1.7}button{width:100%;min-height:48px;margin-top:24px;border:0;border-radius:12px;background:#365d49;color:#fff;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">BR</div>
      <h1>You&apos;re offline</h1>
      <p>Connect to the internet to load current BRUTTI data or save new changes.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
