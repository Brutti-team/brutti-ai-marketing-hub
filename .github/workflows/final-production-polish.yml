name: Final BRUTTI production polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-production-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix patch replacement escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/final_polish.py')
          s = p.read_text()
          s = s.replace("smart_draft = '''", "smart_draft = r'''", 1)
          old = "updated, n = pattern.subn(replacement + '\\n\\n', text, count=1)"
          new = "updated, n = pattern.subn(lambda _match: replacement + '\\n\\n', text, count=1)"
          if old not in s:
              raise SystemExit('replace_block implementation not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply final polish
        run: python scripts/final_polish.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate website
        run: |
          npm ci
          npm run check
          npm run build
      - name: Validate Apps Script syntax
        run: |
          cp apps-script/Code.gs /tmp/brutti-apps-script.js
          node --check /tmp/brutti-apps-script.js
      - name: Verify production markers
        run: |
          grep -q "Dynamic weekly planner" src/App.jsx
          grep -q "Repetition controlled" src/App.jsx
          grep -q "Sync Notion products" src/App.jsx
          grep -q "Publish photo + caption" src/App.jsx
          grep -q "sync_notion_products" apps-script/Code.gs
          grep -q "'/photos'" apps-script/Code.gs
      - name: Remove temporary upgrade machinery
        run: |
          rm -f .github/workflows/apply-frontend-upgrades.yml
          rm -f .github/workflows/apply-backend-upgrades.yml
          rm -f .github/workflows/final-production-polish.yml
          rm -f scripts/frontend_upgrade.py scripts/backend_upgrade.py scripts/final_polish.py
          rmdir scripts 2>/dev/null || true
      - name: Commit production-ready changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Brutti daily marketing workflow"
          git push
