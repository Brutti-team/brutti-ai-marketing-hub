name: Apply BRUTTI caption length fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-caption-length-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Content Studio caption rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          replacements = [
              (
                  "  const buildLanguage = (language) => {",
                  "  const buildLanguage = (language, targetMin = 9, maxLines = 13) => {",
              ),
              (
                  "    while (pieces.filter(Boolean).length < 6 && supportIndex < index + supportPool.length) {",
                  "    while (pieces.filter(Boolean).length < Math.max(1, targetMin - 1) && supportIndex < index + supportPool.length) {",
              ),
              (
                  "    pieces.push(selectCta(language))\n    return pieces.filter(Boolean).slice(0, 7).join('\\n')",
                  "    const body = pieces.filter(Boolean).slice(0, Math.max(1, maxLines - 1))\n    return [...body, selectCta(language)].slice(0, maxLines).join('\\n')",
              ),
              (
                  "  const bm = buildLanguage('bm')\n  const en = buildLanguage('en')",
                  "  const bilingualMode = form.language === 'BM + English'\n  const singleTarget = mode === 'shorten' ? 7 : 9\n  const bm = buildLanguage('bm', bilingualMode ? 6 : singleTarget, bilingualMode ? 6 : 13)\n  const en = buildLanguage('en', bilingualMode ? 6 : singleTarget, bilingualMode ? 6 : 13)",
              ),
              (
                  "    { label:'Caption length (minimum 7 lines)', pass:contentLines.length >= 7 },",
                  "    { label:'Caption length (7–13 lines)', pass:contentLines.length >= 7 && contentLines.length <= 13 },",
              ),
              (
                  "Default voice: Brutti Sabahan Casual — santai, natural dan minimum 7 baris isi.",
                  "Default voice: Brutti Sabahan Casual — santai, natural dengan 7–13 baris isi.",
              ),
              (
                  "Editable Facebook caption · minimum 7 lines",
                  "Editable Facebook caption · 7–13 content lines",
              ),
              (
                  "Add verified facts to generate a minimum 7-line BRUTTI Facebook caption, then refine its hook, tone, CTA and hashtags without leaving this website.",
                  "Add verified facts to generate a 7–13-line BRUTTI Facebook caption, then refine its hook, tone, CTA and hashtags without leaving this website.",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source pattern not found: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit updated caption rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Enforce 7-13 line Brutti captions"
          git push
