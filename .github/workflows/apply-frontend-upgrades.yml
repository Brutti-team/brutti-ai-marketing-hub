name: Apply BRUTTI frontend upgrades

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-frontend-upgrades.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.jsx')
          text = path.read_text()

          def must_replace(old, new, count=1):
              global text
              if old not in text:
                  raise SystemExit('Missing expected pattern: ' + old[:120])
              text = text.replace(old, new, count)

          def replace_block(start, end, replacement):
              global text
              pattern = re.compile(re.escape(start) + r'.*?(?=' + re.escape(end) + r')', re.S)
              text2, n = pattern.subn(replacement + '\n\n', text, count=1)
              if n != 1:
                  raise SystemExit(f'Could not replace block starting {start}')
              text = text2

          must_replace("} from './lib/googleWorkspace'", "} from './lib/googleWorkspace'\nimport { addDays, dateFromKey, formatDateRange, formatTimestamp, greetingForNow, localDateKey, startOfWeek, weekKeys } from './lib/dateUtils'")
          must_replace("  loadWorkspace,\n", "  loadWorkspace,\n  syncNotionProducts,\n")

          must_replace("  { id: 'studio', label: 'Content Studio', icon: 'sparkles', count: 4 },", "  { id: 'studio', label: 'Content Studio', icon: 'sparkles' },")
          must_replace("  { id: 'products', label: 'Product Library', icon: 'box', count: 88 },", "  { id: 'products', label: 'Product Library', icon: 'box' },")
          must_replace("function Sidebar({ page, setPage, open, setOpen, workspaceActive }) {", "function Sidebar({ page, setPage, open, setOpen, workspaceActive, counts }) {")
          must_replace("{navigation.map((item) => (\n            <button key={item.id} className={`nav-link ${page === item.id ? 'active' : ''}`} onClick={() => navigate(item.id)}>\n              <Icon name={item.icon}/><span>{item.label}</span>{item.count ? <em>{item.count}</em> : null}\n            </button>\n          ))}", "{navigation.map((item) => {\n            const count = item.id === 'studio' ? counts.content : item.id === 'products' ? counts.products : null\n            return <button key={item.id} className={`nav-link ${page === item.id ? 'active' : ''}`} onClick={() => navigate(item.id)}>\n              <Icon name={item.icon}/><span>{item.label}</span>{count !== null ? <em>{count}</em> : null}\n            </button>\n          })}")

          must_replace("function Topbar({ setOpen, workspaceActive }) {", "function Topbar({ setOpen, workspaceActive }) {\n  const todayLabel = new Date().toLocaleDateString('en-MY', { day:'2-digit', month:'short', year:'numeric' })")
          must_replace("<span className=\"topbar-date\">Updated 14 Aug 2026</span>", "<span className=\"topbar-date\">{todayLabel}</span>")

          dashboard = r'''function Dashboard({ content, plans, navigate, openContent, newContent, newPlan }) {
  const stageCounts = pipelineStages.map((stage) => ({ stage, count: content.filter((item) => item.stage === stage).length }))
  const today = localDateKey()
  const todayPlans = plans.filter((plan) => plan.date === today)
  const upcoming = [...plans].filter((plan) => plan.date >= today).sort((a,b) => a.date.localeCompare(b.date)).slice(0,4)
  const reviewItem = content.find((item) => item.stage === 'Review')
  const nextPlan = todayPlans[0] || upcoming[0]
  const greeting = greetingForNow()
  const focusTitle = nextPlan ? `${nextPlan.title} is ${nextPlan.date === today ? 'on today’s plan' : 'the next planned content'}.` : 'Build today’s Facebook content from verified BRUTTI facts.'
  const focusCopy = nextPlan ? `${nextPlan.type} · ${nextPlan.product || 'General / No Product'} · ${nextPlan.status}.` : 'Choose a product or verified story, generate a Brutti-style draft and send it through human review.'
  return (
    <div className="page dashboard-page">
      <PageHeader eyebrow="MARKETING CONTROL CENTRE" title={`${greeting}, Michelle.`} description="Plan today’s work, review assisted drafts and keep BRUTTI’s marketing moving from one workspace." actions={<button className="button primary" onClick={newContent}><Icon name="sparkles"/>Create with Assist</button>} />
      <section className="hero-panel">
        <div className="hero-content"><span className="hero-label"><Icon name="sparkles" size={15}/>DAILY FOCUS · {new Date().toLocaleDateString('en-MY',{weekday:'long'})}</span><h2>{focusTitle}</h2><p>{focusCopy}</p><div className="hero-buttons"><button className="button cream" onClick={newContent}>Start creating <Icon name="arrow"/></button><button className="button ghost-light" onClick={() => navigate('planner')}>Open planner</button></div></div>
        <div className="hero-art" aria-hidden="true"><div className="art-grid"/><div className="art-card card-one"><span>01</span><strong>Verified input</strong></div><div className="art-card card-two"><span>02</span><strong>Assist draft</strong></div><div className="art-card card-three"><span>03</span><strong>Human review</strong></div><div className="art-orbit"/></div>
      </section>
      <div className="stats-grid">{verifiedSnapshot.map((stat) => <article className="stat-card" key={stat.label}><div className={`stat-icon ${stat.icon}`}><Icon name={stat.icon}/></div><div><span>{stat.label}</span><strong>{stat.value}</strong><small>{stat.note}</small></div></article>)}</div>
      <div className="dashboard-grid">
        <section className="panel pipeline-panel"><div className="panel-heading"><div><span className="eyebrow">CONTENT WORKFLOW</span><h3>Pipeline at a glance</h3></div><button className="text-button" onClick={() => navigate('studio')}>View library <Icon name="arrow" size={15}/></button></div><div className="pipeline-flow">{stageCounts.map((item,index) => <div className="pipeline-step" key={item.stage}><div><strong>{item.count}</strong><span>{item.stage}</span></div>{index < stageCounts.length-1 ? <Icon name="chevron" size={15}/> : null}</div>)}</div><div className="review-queue">{content.slice(0,3).map((item) => <button key={item.id} onClick={() => openContent(item)}><span className="queue-channel">f</span><span><strong>{item.title}</strong><small>{item.product} · {item.updatedAt}</small></span><StatusPill>{item.stage}</StatusPill><Icon name="chevron"/></button>)}</div></section>
        <aside className="panel focus-panel"><div className="panel-heading"><div><span className="eyebrow">TODAY & NEXT</span><h3>Next best actions</h3></div></div><div className="recommendation-list"><button onClick={() => reviewItem ? openContent(reviewItem) : navigate('studio')}><span className="recommend-number">01</span><div><strong>{reviewItem ? `Review ${reviewItem.title}` : 'Create a verified draft'}</strong><p>{reviewItem ? 'A content item is waiting for human confirmation.' : 'No review item is waiting right now.'}</p></div></button><button onClick={() => navigate('planner')}><span className="recommend-number">02</span><div><strong>{todayPlans.length ? `${todayPlans.length} item${todayPlans.length>1?'s':''} planned today` : 'Today is open'}</strong><p>{todayPlans.length ? 'Open the planner to confirm the day’s sequence.' : 'Add a content idea or move the next suitable plan into today.'}</p></div></button><button onClick={newPlan}><span className="recommend-number">03</span><div><strong>Plan another content slot</strong><p>Keep the next seven days visible and editable.</p></div></button></div><div className="guardrail-note"><Icon name="alert"/><p><strong>Accuracy guardrail</strong>No prices, promotions, delivery dates or performance KPI are generated without a verified source.</p></div></aside>
      </div>
      <section className="panel upcoming-panel"><div className="panel-heading"><div><span className="eyebrow">UPCOMING</span><h3>Next planned content</h3></div><button className="text-button" onClick={() => navigate('planner')}>Manage planner <Icon name="arrow" size={15}/></button></div><div className="upcoming-row">{upcoming.length ? upcoming.map((plan) => <article key={plan.id}><time><b>{dateFromKey(plan.date).toLocaleDateString('en-MY',{day:'2-digit'})}</b><span>{dateFromKey(plan.date).toLocaleDateString('en-MY',{month:'short'})}</span></time><div><strong>{plan.title}</strong><small>{plan.type} · {plan.channel}</small></div><StatusPill>{plan.status}</StatusPill></article>) : <p className="settings-copy">No upcoming plans yet. Add one from Campaign Planner.</p>}</div></section>
    </div>
  )
}'''
          replace_block('function Dashboard(', 'const bruttiCopyBank', dashboard)

          must_replace("function GeneratorForm({ form, setForm, onGenerate, output, onOutputChange, saveDraft, workspaceActive, toast }) {", "function GeneratorForm({ form, setForm, onGenerate, output, onOutputChange, saveDraft, workspaceActive, toast, productOptions }) {")
          must_replace("<label>Product<select value={form.product} onChange={update('product')}><option>General / No Product</option>{productNames.map((name) => <option key={name}>{name}</option>)}</select></label>", "<label>Product<select value={form.product} onChange={update('product')}><option>General / No Product</option>{productOptions.map((product) => <option key={product.id || product.name} value={product.name}>{product.name}</option>)}</select></label>")
          must_replace("<div className=\"brief-polish-row\"><button type=\"button\" onClick={polishBrief}", "{form.assetName ? <div className=\"selected-asset\"><Icon name=\"image\"/><span><strong>Selected visual</strong><small>{form.assetName}</small></span><button type=\"button\" onClick={() => setForm((current) => ({...current, driveFileId:'', assetName:'', driveLink:''}))}>Remove</button></div> : null}<div className=\"brief-polish-row\"><button type=\"button\" onClick={polishBrief}")
          must_replace("function ContentStudio({ content, deleteContent, generator, setGenerator, output, setOutput, generate, saveDraft, openContent, workspaceActive, toast }) {", "function ContentStudio({ content, deleteContent, generator, setGenerator, output, setOutput, generate, saveDraft, openContent, workspaceActive, toast, productOptions }) {")
          must_replace("<GeneratorForm form={generator} setForm={setGenerator} onGenerate={generate} output={output} onOutputChange={setOutput} saveDraft={saveDraft} workspaceActive={workspaceActive} toast={toast}/>", "<GeneratorForm form={generator} setForm={setGenerator} onGenerate={generate} output={output} onOutputChange={setOutput} saveDraft={saveDraft} workspaceActive={workspaceActive} toast={toast} productOptions={productOptions}/>")

          planner = r'''function CampaignPlanner({ plans, openPlan, newPlan, deletePlan }) {
  const [anchor, setAnchor] = useState(() => startOfWeek(new Date()))
  const week = weekKeys(anchor)
  const today = localDateKey()
  const weekPlans = plans.filter((plan) => week.includes(plan.date))
  const moveWeek = (days) => setAnchor((current) => addDays(current, days))
  return (
    <div className="page">
      <PageHeader eyebrow="CONTENT CALENDAR" title="Campaign Planner" description="Dynamic weekly planner synced with your current date and ready for daily marketing operations." actions={<button className="button primary" onClick={() => newPlan(today)}><Icon name="plus"/>Add content</button>} />
      <div className="planner-summary dynamic-planner-summary"><div><span>Week</span><strong>{formatDateRange(week)}</strong><small>{weekPlans.length} planned item{weekPlans.length === 1 ? '' : 's'}</small></div><div className="planner-nav"><button className="button secondary small" onClick={() => moveWeek(-7)}>← Previous</button><button className="button secondary small" onClick={() => setAnchor(startOfWeek(new Date()))}>Today</button><button className="button secondary small" onClick={() => moveWeek(7)}>Next →</button></div></div>
      <section className="week-calendar">{week.map((date) => { const items = plans.filter((plan) => plan.date === date); const day = dateFromKey(date); return <div className={`calendar-day ${date === today ? 'is-today' : ''}`} key={date}><div className="calendar-day-head"><span>{day.toLocaleDateString('en-MY',{weekday:'short'})}{date === today ? ' · Today' : ''}</span><strong>{day.getDate()}</strong></div><div className="calendar-items">{items.map((plan) => <button className={`calendar-item ${stageClass(plan.status)}`} key={plan.id} onClick={() => openPlan(plan)}><small>{plan.type}</small><strong>{plan.title}</strong><span>{plan.channel} · {plan.status}</span></button>)}<button className="add-day" onClick={() => newPlan(date)}><Icon name="plus" size={14}/>Add</button></div></div>})}</section>
      <div className="planner-bottom-grid"><section className="panel campaign-section"><div className="panel-heading"><div><span className="eyebrow">SMART CAMPAIGN IDEAS</span><h3>Ready for planning</h3></div></div><div className="campaign-list">{campaignIdeas.map((idea,index) => <article key={idea.title}><span className="campaign-index">{String(index+1).padStart(2,'0')}</span><div><strong>{idea.title}</strong><p>{idea.objective}</p><small>{idea.pillar}</small></div><button className="button secondary small" onClick={() => newPlan(today, idea)}>Plan idea</button></article>)}</div></section><section className="panel plan-list-section"><div className="panel-heading"><div><span className="eyebrow">ALL PLANS</span><h3>{plans.length} total items</h3></div></div><div className="compact-plan-list">{[...plans].sort((a,b) => a.date.localeCompare(b.date)).map((plan) => <div key={plan.id}><button onClick={() => openPlan(plan)}><time>{dateFromKey(plan.date).toLocaleDateString('en-MY',{day:'2-digit',month:'short'})}</time><span><strong>{plan.title}</strong><small>{plan.type}</small></span><StatusPill>{plan.status}</StatusPill></button><button className="delete-plan" onClick={() => deletePlan(plan.id)} aria-label={`Delete ${plan.title}`}><Icon name="trash" size={15}/></button></div>)}</div></section></div>
    </div>
  )
}'''
          replace_block('function CampaignPlanner(', 'function BrandLibrary()', planner)

          products_component = r'''function ProductLibrary({ onUseProduct, productData, workspaceActive, notionActive, onSyncNotion, syncing }) {
  const [query, setQuery] = useState('')
  const [category, setCategory] = useState('All')
  const categories = ['All', ...Array.from(new Set(productData.map((product) => product.category).filter(Boolean))).sort()]
  const visible = productData.filter((product) => (category === 'All' || product.category === category) && `${product.name} ${product.category} ${product.price || ''}`.toLowerCase().includes(query.toLowerCase()))
  return (
    <div className="page">
      <PageHeader eyebrow="VERIFIED PRODUCT SOURCE" title="Product Library" description="Use verified product details from BRUTTI sources. Notion sync can populate the full 88-product table without exposing its token in the browser." actions={<div className="page-actions"><span className="source-count">{productData.length} loaded</span>{workspaceActive && notionActive ? <button className="button secondary small" disabled={syncing} onClick={onSyncNotion}>{syncing ? 'Syncing…' : 'Sync Notion products'}</button> : null}</div>} />
      <div className="library-toolbar product-toolbar"><div className="search-box"><Icon name="search"/><input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Search products, category or price…"/></div><select value={category} onChange={(event) => setCategory(event.target.value)}>{categories.map((value) => <option key={value}>{value}</option>)}</select></div>
      <div className="product-grid">{visible.map((product,index) => <article className="product-card" key={product.id || product.name}><div className={`product-visual visual-${index%5}`}><div className="furniture-shape"><span/><span/><span/></div><span className="photo-status">{product.photoConfirmed ? 'Photo confirmed' : product.sourceStatus || 'Verified source'}</span></div><div className="product-card-body"><div><span>{product.id} · {product.category || 'Uncategorised'}</span><h3>{product.name}</h3></div><p>{product.price ? <><strong>{product.price}</strong><br/></> : null}{product.material || product.dimensions ? `${product.material || ''}${product.material && product.dimensions ? ' · ' : ''}${product.dimensions || ''}` : 'Verified name. Add specifications from the source before making product claims.'}</p><button className="text-button" onClick={() => onUseProduct(product)}>Create product content <Icon name="arrow" size={15}/></button></div></article>)}</div>
      {!visible.length ? <div className="empty-list">No products match this search.</div> : null}
      <div className="source-notice"><Icon name={productData.length >= 88 ? 'check' : 'alert'}/><div><strong>{productData.length >= 88 ? 'Product source loaded' : 'Product sync readiness'}</strong><p>{productData.length >= 88 ? 'The full verified product set is available in this workspace.' : 'The website is using its verified fallback set. Configure Notion in Apps Script, then use Sync Notion products to load the full source table.'}</p></div></div>
    </div>
  )
}'''
          replace_block('function ProductLibrary(', 'function AssetLibrary(', products_component)

          assets_component = r'''function AssetLibrary({ toast, workspaceActive, driveActive, onUseAsset }) {
  const fallbackAssets = ['KAANAGAN front view','KAANAGAN side view','AHTAM XL front view','AHTAM M front view','GANTUNG product view','PUSMA display view','POPO console view','SULOB shoe rack view','TOMODON organizer view','BRUTTI workshop reference'].map((name,index) => ({id:`fallback-${index}`,name,url:'',mimeType:'reference'}))
  const [driveAssets, setDriveAssets] = useState([])
  const [query, setQuery] = useState('')
  useEffect(() => { if (!workspaceActive || !driveActive) return; callMarketingApi('list_drive_assets').then((result) => setDriveAssets(result.files || [])).catch((error) => toast(error.message)) }, [workspaceActive, driveActive, toast])
  const assets = driveAssets.length ? driveAssets : fallbackAssets
  const visible = assets.filter((asset) => asset.name.toLowerCase().includes(query.toLowerCase()))
  return (
    <div className="page">
      <PageHeader eyebrow="CREATIVE SOURCE FILES" title="Asset Library" description="Choose an approved Drive visual and send it directly into Content Studio for caption review and image publishing." actions={<button className="button secondary" onClick={() => toast('Upload new assets through the controlled Google Drive folder.')}><Icon name="plus"/>Add asset</button>} />
      <div className="asset-summary"><article><strong>{assets.length}</strong><span>{driveAssets.length ? 'Drive assets loaded' : 'Confirmed references'}</span></article><article><strong>{driveAssets.length}</strong><span>Direct Drive files connected</span></article><article><strong>{driveActive ? 'Ready' : 'Pending'}</strong><span>Secure Drive connection</span></article></div>
      <section className="panel asset-panel"><div className="library-toolbar"><div className="search-box"><Icon name="search"/><input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Search assets…"/></div><span className={`status-chip ${driveActive ? 'connected' : 'pending'}`}><span/>{driveActive ? 'Drive connected' : 'Drive sync pending'}</span></div><div className="asset-grid">{visible.map((asset,index) => <article key={asset.id || asset.name}><div className={`asset-preview asset-${index%4}`}><Icon name="image" size={28}/><span>{String(index+1).padStart(2,'0')}</span></div><div><strong>{asset.name}</strong><p>{driveAssets.length ? asset.mimeType || 'Google Drive asset' : 'Reference record · product asset'}</p><div><StatusPill>{driveAssets.length ? 'Connected' : 'Verified name'}</StatusPill>{driveAssets.length ? <button className="asset-use-button" onClick={() => onUseAsset(asset)} aria-label={`Use ${asset.name} in content`}><Icon name="arrow"/></button> : <button onClick={() => toast('Connect Google Drive to attach this visual.')}><Icon name="chevron"/></button>}</div></div></article>)}</div></section>
    </div>
  )
}'''
          replace_block('function AssetLibrary(', 'function AITools(', assets_component)

          analytics_component = r'''function Analytics({ content, plans, productData, integrations }) {
  const sources = [['Follower export','Facebook','12,001 records','Imported snapshot'],['Reaction export','Facebook','728 records','Imported snapshot'],['Media archive','Facebook','7,062 files','Reference count'],['Product source','Notion / Google',`${productData.length} loaded`,productData.length >= 88 ? 'Full product set' : 'Partial sync']]
  const stages = ['Draft','AI Generated','Review','Approved','Scheduled','Published']
  const maxCount = Math.max(1, ...stages.map((stage) => content.filter((item) => item.stage === stage).length))
  const scheduledPlans = plans.filter((plan) => plan.status === 'Scheduled').length
  const published = content.filter((item) => item.stage === 'Published').length
  const withAssets = content.filter((item) => item.driveFileId).length
  return (
    <div className="page">
      <PageHeader eyebrow="VERIFIED ACTIVITY DATA" title="Analytics" description="Operational marketing analytics now update from the workspace. Meta performance KPI remain excluded until a verified Insights source exists." actions={<span className={`status-chip ${integrations.meta ? 'connected' : 'pending'}`}><span/>{integrations.meta ? 'Meta publishing connected' : 'Meta KPI excluded'}</span>} />
      <div className="analytics-notice"><Icon name="alert"/><div><strong>No fabricated performance KPI</strong><p>Reach, views, engagement rate, followers gained, enquiries and sales attribution stay blank until verified monthly or post-level exports are mapped.</p></div></div>
      <div className="stats-grid analytics-stats"><article className="stat-card"><div className="stat-icon file"><Icon name="file"/></div><div><span>Content records</span><strong>{content.length}</strong><small>{content.filter((item)=>item.stage==='Review').length} awaiting review</small></div></article><article className="stat-card"><div className="stat-icon calendar"><Icon name="calendar"/></div><div><span>Scheduled plans</span><strong>{scheduledPlans}</strong><small>{plans.length} total planner items</small></div></article><article className="stat-card"><div className="stat-icon image"><Icon name="image"/></div><div><span>Drafts with visual</span><strong>{withAssets}</strong><small>Drive assets attached to content</small></div></article><article className="stat-card"><div className="stat-icon check"><Icon name="check"/></div><div><span>Published records</span><strong>{published}</strong><small>Workspace publishing history</small></div></article></div>
      <div className="analytics-grid"><section className="panel activity-chart"><div className="panel-heading"><div><span className="eyebrow">CONTENT ACTIVITY</span><h3>Live workflow distribution</h3></div><span className="verified-label"><Icon name="check"/>Workspace records</span></div><div className="bar-chart">{stages.map((stage) => { const count = content.filter((item) => item.stage === stage).length; return <div key={stage}><span>{stage}</span><i><b style={{width:`${Math.round((count/maxCount)*100)}%`}}/></i><strong>{count}</strong></div> })}</div></section><section className="panel insight-card"><span className="eyebrow">RULE-BASED OBSERVATION</span><h3>{content.some((item)=>item.stage==='Review') ? 'Clear the review queue before adding too many new drafts.' : 'The review queue is clear.'}</h3><p>{integrations.notion ? 'Notion planner sync is configured for shared planning records.' : 'Notion backend sync is not configured yet; Google remains the current operational source.'}</p><div className="insight-source"><Icon name="file"/><span><strong>Next data upgrade</strong><small>Verified post URL + reach + views + engagements</small></span></div></section></div>
      <section className="panel source-table-panel"><div className="panel-heading"><div><span className="eyebrow">DATA SOURCES</span><h3>Available source snapshot</h3></div></div><div className="source-table"><div className="source-row header"><span>Source</span><span>Platform</span><span>Volume</span><span>Status</span></div>{sources.map((row) => <div className="source-row" key={row[0]}>{row.map((cell,index) => <span key={`${row[0]}-${index}`}>{index===3 ? <StatusPill>{cell}</StatusPill> : cell}</span>)}</div>)}</div></section>
    </div>
  )
}'''
          replace_block('function Analytics(', 'function Settings(', analytics_component)

          must_replace("    { name:'Google Drive', detail:'BRUTTI AI MARKETING SYSTEM and approved assets', status:integrations.drive ? 'Connected' : 'Not connected', icon:'image' },", "    { name:'Google Drive', detail:'BRUTTI AI MARKETING SYSTEM and approved assets', status:integrations.drive ? 'Connected' : 'Not connected', icon:'image' },\n    { name:'Notion', detail:'Product Database and BRUTTI DAILY CONTENT PLANNER sync through Apps Script', status:integrations.notion ? 'Connected' : 'Not connected', icon:'file' },")

          must_replace("  const [generator, setGenerator] = useState({ title:'', platform:'Facebook', type:'Brand Awareness', product:'General / No Product', language:'Bahasa Melayu', tone:'Brutti Sabahan Casual', brief:'', includeHashtags:true })", "  const [generator, setGenerator] = useState({ title:'', platform:'Facebook', type:'Brand Awareness', product:'General / No Product', language:'Bahasa Melayu', tone:'Brutti Sabahan Casual', brief:'', includeHashtags:true, driveFileId:'', assetName:'', driveLink:'' })\n  const [productData, setProductData] = useState(products)\n  const [syncingProducts, setSyncingProducts] = useState(false)")
          must_replace("  const [integrations, setIntegrations] = useState({ appsScript:false, sheets:false, openai:false, drive:false, meta:false })", "  const [integrations, setIntegrations] = useState({ appsScript:false, sheets:false, drive:false, notion:false, meta:false })")
          must_replace("      setIntegrations({ appsScript:false, sheets:false, openai:false, drive:false, meta:false })", "      setIntegrations({ appsScript:false, sheets:false, drive:false, notion:false, meta:false })", 2)
          must_replace("        setPlans(workspace.plans || [])\n        setWorkspaceActive(true)", "        setPlans(workspace.plans || [])\n        setProductData(workspace.products?.length ? workspace.products : products)\n        setWorkspaceActive(true)", 1)
          must_replace("      setPlans(workspace.plans || [])\n      setWorkspaceActive(true)", "      setPlans(workspace.plans || [])\n      setProductData(workspace.products?.length ? workspace.products : products)\n      setWorkspaceActive(true)", 1)
          must_replace("    setPlans(initialPlans)\n    toast('Google workspace disconnected. Local preview mode restored.')", "    setPlans(initialPlans)\n    setProductData(products)\n    toast('Google workspace disconnected. Local preview mode restored.')")
          must_replace("updatedAt:'14 Aug 2026, just now', copy:output", "updatedAt:formatTimestamp(), copy:output, driveFileId:generator.driveFileId || '', assetName:generator.assetName || '', driveLink:generator.driveLink || ''")
          must_replace("  const openNewPlan = (date = '2026-08-19', idea) => setActivePlan({ id:null, title:idea?.title || '', date:date || '2026-08-19',", "  const openNewPlan = (date = localDateKey(), idea) => setActivePlan({ id:null, title:idea?.title || '', date:date || localDateKey(),")
          must_replace("updatedAt:'14 Aug 2026, just now'", "updatedAt:formatTimestamp()")
          must_replace("  const useProduct = (product) => { setGenerator((form) => ({...form, product, title:`${product} – Product Highlight`, type:'Product Highlight'})); setPage('studio'); setOutput(''); window.scrollTo({top:0}) }", "  const useProduct = (product) => { const details = [product.price, product.material, product.dimensions, product.colour].filter(Boolean).join('; '); setGenerator((form) => ({...form, product:product.name, title:`${product.name} – Product Highlight`, type:'Product Highlight', brief:details || form.brief})); setPage('studio'); setOutput(''); window.scrollTo({top:0}) }\n  const useAsset = (asset) => { setGenerator((form) => ({...form, driveFileId:asset.id || '', assetName:asset.name || '', driveLink:asset.url || ''})); setPage('studio'); setOutput(''); window.scrollTo({top:0}); toast(`${asset.name} attached to the next content draft.`) }\n  const syncProducts = async () => { setSyncingProducts(true); try { const result = await syncNotionProducts(); setProductData(result.products?.length ? result.products : productData); toast(`${result.products?.length || 0} verified products synced from Notion.`) } catch (error) { toast(error.message) } finally { setSyncingProducts(false) } }")

          must_replace("    studio: <ContentStudio content={content} deleteContent={deleteContent} generator={generator} setGenerator={setGenerator} output={output} setOutput={setOutput} generate={generate} saveDraft={saveGeneratedDraft} openContent={setActiveContent} workspaceActive={workspaceActive} toast={toast} />", "    studio: <ContentStudio content={content} deleteContent={deleteContent} generator={generator} setGenerator={setGenerator} output={output} setOutput={setOutput} generate={generate} saveDraft={saveGeneratedDraft} openContent={setActiveContent} workspaceActive={workspaceActive} toast={toast} productOptions={productData} />")
          must_replace("    products: <ProductLibrary onUseProduct={useProduct} />", "    products: <ProductLibrary onUseProduct={useProduct} productData={productData} workspaceActive={workspaceActive} notionActive={integrations.notion} onSyncNotion={syncProducts} syncing={syncingProducts} />")
          must_replace("    assets: <AssetLibrary toast={toast} workspaceActive={workspaceActive} driveActive={integrations.drive} />", "    assets: <AssetLibrary toast={toast} workspaceActive={workspaceActive} driveActive={integrations.drive} onUseAsset={useAsset} />")
          must_replace("    analytics: <Analytics />", "    analytics: <Analytics content={content} plans={plans} productData={productData} integrations={integrations} />")
          must_replace("  }), [page, content, plans, generator, output, workspaceActive, integrations])", "  }), [page, content, plans, generator, output, workspaceActive, integrations, productData, syncingProducts])")
          must_replace("      <Sidebar page={page} setPage={setPage} open={sidebarOpen} setOpen={setSidebarOpen} workspaceActive={workspaceActive}/>", "      <Sidebar page={page} setPage={setPage} open={sidebarOpen} setOpen={setSidebarOpen} workspaceActive={workspaceActive} counts={{content:content.length,products:productData.length}}/>")

          must_replace("<div className=\"content-meta\"><StatusPill>{draft.stage}</StatusPill><span>{draft.platform}</span><span>{draft.product}</span></div>", "<div className=\"content-meta\"><StatusPill>{draft.stage}</StatusPill><span>{draft.platform}</span><span>{draft.product}</span>{draft.assetName ? <span>Visual: {draft.assetName}</span> : null}</div>")
          must_replace(">Publish to Facebook</button>", ">{draft.driveFileId ? 'Publish photo + caption' : 'Publish to Facebook'}</button>")

          path.write_text(text)

          data = Path('src/data.js')
          d = data.read_text().replace("aiReview: 'AI Approved'", "aiReview: 'Rule Check Passed'")
          data.write_text(d)

          gw = Path('src/lib/googleWorkspace.js')
          g = gw.read_text()
          if 'syncNotionProducts' not in g:
              g += "\nexport async function syncNotionProducts() {\n  return callMarketingApi('sync_notion_products')\n}\n"
          gw.write_text(g)

          css = Path('src/styles.css')
          c = css.read_text()
          c += r'''

/* Dynamic operations upgrades */
.dynamic-planner-summary { gap: 18px; flex-wrap: wrap; }
.dynamic-planner-summary small { display:block; margin-top:4px; color:var(--muted, #6f746f); }
.planner-nav { display:flex; gap:8px; flex-wrap:wrap; }
.calendar-day.is-today { outline:2px solid rgba(201,111,74,.55); outline-offset:-2px; }
.calendar-day.is-today .calendar-day-head { background:rgba(201,111,74,.09); }
.selected-asset { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid rgba(18,55,42,.16); border-radius:12px; background:rgba(18,55,42,.04); margin:10px 0; }
.selected-asset span { display:flex; flex-direction:column; flex:1; min-width:0; }
.selected-asset small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.selected-asset button { border:0; background:transparent; text-decoration:underline; cursor:pointer; }
.asset-use-button { display:inline-flex; align-items:center; justify-content:center; }
.product-card-body p strong { font-weight:700; }
'''
          css.write_text(c)
