name: Apply BRUTTI frontend upgrades

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-frontend-upgrades.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch frontend
        run: python scripts/frontend_upgrade.py
      - name: Validate
        run: |
          npm ci
          npm run check
          npm run build
      - name: Commit frontend upgrades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/data.js src/lib/googleWorkspace.js src/styles.css
          git commit -m "Upgrade planner, products, assets and analytics"
          git push
