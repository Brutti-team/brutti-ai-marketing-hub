name: Apply BRUTTI backend upgrades

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-backend-upgrades.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch backend
        run: python scripts/backend_upgrade.py
      - name: Validate frontend build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run check
          npm run build
      - name: Commit backend upgrades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs README.md
          git commit -m "Add Notion sync and photo publishing backend"
          git push
