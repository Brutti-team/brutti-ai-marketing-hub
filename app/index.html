<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1efe7" />
    <meta name="description" content="Brutti AI Marketing Hub — an AI-first marketing workspace for Brutti." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BRUTTI AI" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('brutti-ui-theme') === 'dark' ? 'dark' : 'light';
          var d = document.documentElement;
          d.dataset.theme = t;
          d.style.colorScheme = t;
          if (localStorage.getItem('brutti-ui-language-v1') === 'en') {
            d.classList.add('lang-pending');
            setTimeout(function () { d.classList.remove('lang-pending'); }, 2500);
          }
          var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (sb) sb.setAttribute('content', t === 'dark' ? 'black-translucent' : 'default');
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute("content", t === "dark" ? "#0f1411" : "#f1efe7");
          var b = Number(localStorage.getItem('brutti-ui-brightness-v2'));
          if (isFinite(b) && localStorage.getItem('brutti-ui-brightness-v2') !== null) {
            b = Math.min(100, Math.max(0, Math.round(b)));
            var f = (t === 'dark' && b > 75) ? 1 + ((b - 75) * 0.35) / 25 : (40 + 80 * b / 100) / 100;
            if (f !== 1) d.style.filter = 'brightness(' + f + ')';
          }
        } catch (e) {}
      })();
    </script>
    <style>html.lang-pending #root{visibility:hidden}</style>
    <title>Brutti AI Marketing Hub</title>
    <link rel="manifest" href="/brutti-ai-marketing-hub/manifest.webmanifest" />
    <link rel="icon" href="/brutti-ai-marketing-hub/icons/brutti-official-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brutti-ai-marketing-hub/icons/brutti-apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/main.jsx"></script>
    <script type="module" src="../src/brand-visual-enhancer.js"></script>
    <script type="module" src="../src/brand-static-fix.js"></script>
  </body>
</html>
